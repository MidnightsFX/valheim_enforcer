# Release configuration for mod-tools.
# Shared settings come from the preset, which ships inside the gem.
#
# Inspect what this actually resolves to:
#   mod-tools print-config

extends:  jotunn
assembly: ValheimEnforcer

deploy:
  enabled: true

publish:
  github:
    enabled: true

  discord:
    enabled: true

  thunderstore:
    enabled: true
    author_name: MidnightMods          # the Thunderstore TEAM, not your username
    communities: [valheim]
    categories: []                    # optional
    has_nsfw_content: false           # optional, default false

  hexium:
    enabled: false
    base_url: https://valheim.hexium.gg   # required: the community subdomain
    author_name: MidnightMods
    communities: [valheim]
