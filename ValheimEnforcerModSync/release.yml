# Release configuration for mod-tools: the mod sync add-on, released on GitHub only, beside ValheimEnforcer,
# under its own ValheimEnforcerModSync-v* tags.
# Shared settings come from the preset, which ships inside the gem.
#
# Inspect what this actually resolves to:
#   mod-tools print-config --root ValheimEnforcerModSync

extends:  jotunn-mono
assembly: ValheimEnforcerModSync

# Thunderstore is deliberately off: this is distributed as a GitHub release only. The manifest still declares
# MidnightMods-ValheimEnforcer, so Gale and r2modman can import the zip as a local mod; release ValheimEnforcer
# first, since the dependency check wants that version on Thunderstore.
publish:
  github:
    enabled: true
    # The repository's latest release stays ValheimEnforcer's.
    make_latest: false
